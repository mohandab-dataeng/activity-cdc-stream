[project]
name = "activity-cdc-stream"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.15.1",
    "geopy>=2.5.0",
    "great-expectations>=1.23.1",
    "ipykernel>=7.3.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.13",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.54",
    "deltalake>=0.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
