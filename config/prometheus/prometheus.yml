global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'spark-transform'
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['spark:4040']

  - job_name: 'spark-clean'
    metrics_path: /metrics/prometheus
    static_configs:
      - targets: ['spark:4041']