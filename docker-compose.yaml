networks:
  activity_cdc_network:
    name: activity_cdc_network
    driver: bridge


services:
  postgres:
    image: postgres:16
    container_name: postgres_activity_cdc
    restart: unless-stopped
    networks:
      - activity_cdc_network
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5


  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    restart: unless-stopped
    networks:
      - activity_cdc_network
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "9092:9092"
      - "19092:19092"
      - "8081:8081"
      - "8082:8082"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 10s
      timeout: 5s
      retries: 5


  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda_console
    restart: unless-stopped
    networks:
      - activity_cdc_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    ports:
      - "8080:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:9092"]
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      redpanda:
        condition: service_healthy


  spark:
    image: apache/spark:3.5.2-python3
    container_name: spark
    restart: unless-stopped
    networks:
      - activity_cdc_network
    environment:
      SPARK_MODE: master
    ports:
      - "8090:8080"
      - "7077:7077"
      - "4040:4040"
    volumes:
      - ./src:/opt/spark-apps/src
      - ./data:/data
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]


  kafka-connect:
    image: debezium/connect:3.0.0.Final
    container_name: kafka_connect
    restart: unless-stopped
    networks:
      - activity_cdc_network
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: activity-cdc-group
      CONFIG_STORAGE_TOPIC: debezium_config
      OFFSET_STORAGE_TOPIC: debezium_offset
      STATUS_STORAGE_TOPIC: debezium_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/ || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5


  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka_exporter
    restart: unless-stopped
    networks:
      - activity_cdc_network
    command:
      - --kafka.server=redpanda:9092
    ports:
      - "9308:9308"
    depends_on:
      redpanda:
        condition: service_healthy


  osrm:
    image: osrm/osrm-backend
    container_name: osrm
    restart: unless-stopped
    networks:
      - activity_cdc_network
    ports:
      - "5000:5000"
    volumes:
      - ./data/osrm:/data
    command: osrm-routed --algorithm mld /data/france-latest.osrm


  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    networks:
      - activity_cdc_network
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5


  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - activity_cdc_network
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    ports:
      - "3000:3000"
    volumes:
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/provisioning:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      prometheus:
        condition: service_healthy


  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    restart: unless-stopped
    networks:
      - activity_cdc_network
    ports:
      - "3001:3000"
    volumes:
      - metabase_data:/metabase-data
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s


  pipeline-image:
    # Ne tourne pas en continu : son seul rôle est de construire l'image
    # activity-cdc-stream-pipeline:latest, utilisée par Kestra pour exécuter
    # les tâches Python (voir Dockerfile). `docker compose up`/`build` la
    # (re)construit automatiquement ; sans ce service, l'image doit être
    # buildée manuellement et disparaît après un `docker system prune`
    # ou un redémarrage qui viderait le cache Docker.
    build:
      context: .
      dockerfile: Dockerfile
    image: activity-cdc-stream-pipeline:latest
    command: ["true"]


  kestra:
    image: kestra/kestra:latest
    user: root
    command: server standalone
    volumes:
      # Socket Docker pour piloter les conteneurs frères (spark, etc.)
      - /var/run/docker.sock:/var/run/docker.sock
      # Montage du projet pour que Kestra puisse exécuter les scripts Python
      - .:/app/project
      # Persistence interne Kestra
      - kestra_data:/app/storage
      # Import automatique des flows au démarrage
      - ./kestra/flows:/app/flows:ro
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/sportdata
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER:-postgres}
            password: ${POSTGRES_PASSWORD:-postgres}
        kestra:
          queue:
            type: postgres
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          plugins:
            configurations:
              - type: io.kestra.plugin.scripts.runner.docker.Docker
                values:
                  volume-enabled: true
    ports:
      - "8085:8080"   # 8082 car 8080 est pris par Redpanda Console
    networks:
      - activity_cdc_network
    depends_on:
      postgres:
        condition: service_healthy
      pipeline-image:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/v1/configs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  postgres_data:
  redpanda_data:
  prometheus_data:
  grafana_data:
  metabase_data:
  kestra_data: